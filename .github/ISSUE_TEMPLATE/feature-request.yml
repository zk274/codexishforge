name: Feature request
description: Propose a CodeXishForge local-first Linux workflow improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include credentials, prompts, responses, account identifiers, private repository content, or complete local paths. Use the repository Security tab for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What coding workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful outcome, including graceful degradation when optional capabilities are unavailable.
    validations:
      required: true
  - type: textarea
    id: linux
    attributes:
      label: Linux integration considerations
      description: Note affected desktops, display sessions, portals, packaging, keyboard, or screen-reader behavior.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This supports a repository-first coding workflow rather than a general chat feature.
          required: true
        - label: I removed credentials, account data, private content, prompts/responses, and complete local paths.
          required: true
