name: Release gates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-packages:
    name: Build and verify Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools xdotool xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run release verification
        run: npm run release:verify

      - name: Attest release provenance
        if: github.event.repository.visibility == 'public'
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Preserve provenance bundle
        if: github.event.repository.visibility == 'public'
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/release-provenance.sigstore.json

      - name: Attest release SBOM
        if: github.event.repository.visibility == 'public'
        id: sbom
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/release-sbom.cdx.json

      - name: Preserve SBOM attestation bundle
        if: github.event.repository.visibility == 'public'
        run: cp "${{ steps.sbom.outputs.bundle-path }}" dist/release-sbom.sigstore.json

      - name: Defer hosted attestations while private
        if: github.event.repository.visibility != 'public'
        run: echo "Trust metadata is verified; GitHub/Sigstore attestations activate automatically when the repository is public."

      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: codex-linux-community-${{ github.ref_name }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*-linux.yml
            dist/*.blockmap
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-sbom.cdx.json
            dist/desktop-compatibility-report.json
            dist/*.sigstore.json
          retention-days: 14
